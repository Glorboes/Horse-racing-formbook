<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0c0e">
<title>History — Formbook</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .ready{border-radius:16px;padding:18px 18px 6px;margin-bottom:6px;border:1px solid var(--line);
    background:radial-gradient(120% 140% at 50% -20%,rgba(212,175,55,.10),transparent 60%),#141418}
  .ready.go{border-color:rgba(95,191,118,.5);
    background:radial-gradient(120% 140% at 50% -20%,rgba(95,191,118,.18),transparent 60%),#111611}
  .ready .status{display:flex;align-items:center;gap:14px;margin-bottom:4px}
  .ready .orb{width:52px;height:52px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:26px;
    background:radial-gradient(circle at 50% 35%,#3a2c14,#1c1712);box-shadow:0 0 0 1px var(--line),0 0 22px rgba(212,175,55,.25)}
  .ready.go .orb{background:radial-gradient(circle at 50% 35%,#1f4a2a,#12261a);box-shadow:0 0 0 1px rgba(95,191,118,.5),0 0 26px rgba(95,191,118,.45)}
  .ready .stitle{font-size:19px;font-weight:800;letter-spacing:.01em;color:var(--ink)}
  .ready.go .stitle{color:#7fe0a0}
  .ready .ssub{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.45}
  .ready .count{margin-left:auto;text-align:center;flex:0 0 auto}
  .ready .count b{display:block;font-size:22px;color:var(--gold2);line-height:1}
  .ready .count.go b{color:#7fe0a0}
  .ready .count span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .crit{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .crit .row{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .crit .row:last-child{border-bottom:none}
  .crit .top{display:flex;align-items:center;gap:10px}
  .crit .tick{width:20px;height:20px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;
    background:#221c10;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
  .crit .row.ok .tick{background:rgba(95,191,118,.16);color:#7fe0a0;box-shadow:inset 0 0 0 1px rgba(95,191,118,.5)}
  .crit .lbl{font-weight:600;font-size:14px;color:var(--ink)}
  .crit .row.ok .lbl{color:#cfead9}
  .crit .det{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right}
  .crit .bar{height:5px;border-radius:4px;background:#24242b;margin:8px 0 0 30px;overflow:hidden}
  .crit .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
  .crit .row.ok .bar i{background:linear-gradient(90deg,#3c9f5c,#7fe0a0)}
</style>
</head>
<body>
<div id="nav"></div>
<div class="wrap" id="app">
  <div class="pagehead"><h1>Strike rate & history</h1></div>
  <div id="body"><div class="empty">Loading…</div></div>
</div>

<script src="assets/common.js"></script>
<script>
const F=window.Formbook, esc=F.esc;
if(F.requireUnlock()){ F.renderNav('history'); boot(); }

async function boot(){
  try{
    const [sr,m]=await Promise.all([
      F.fetchJSON('data/strike-rate.json'),
      F.fetchJSON('data/manifest.json').catch(()=>({predictions:[]}))
    ]);
    render(sr,m);
  }catch(err){
    document.getElementById('body').innerHTML='<div class="empty">Could not load history.<br><small>'+esc(err.message)+'</small></div>';
  }
}

function render(sr,m){
  document.getElementById('body').innerHTML = readinessCard(sr)+summaryCard(sr)+calibrationCard(sr)+clvCard(sr)+historyCard(sr,m);
}

// BETTING READINESS — the honest "should we put money on it yet?" gate.
function readinessCard(sr){
  const r=sr.readiness;
  if(!r) return '';
  const go=r.green;
  const title=go?'Green light — a small stake is justified':'Not yet — keep logging';
  const sub=go
    ? 'All five signals are green. Start tiny, fractional-Kelly, only money you can lose — and watch it can still decay.'
    : 'Bet nothing until all five turn green. This is measured from results, not a guess — and it holds even when we\'re both keen.';
  const rows=(r.criteria||[]).map(c=>`
    <div class="row ${c.pass?'ok':''}">
      <div class="top">
        <span class="tick">${c.pass?'✓':'•'}</span>
        <span class="lbl">${esc(c.label)}</span>
        <span class="det">${esc(c.detail)}</span>
      </div>
      <div class="bar"><i style="width:${Math.round((c.progress||0)*100)}%"></i></div>
    </div>`).join('');
  return `<section class="card">
    <div class="ready ${go?'go':''}">
      <div class="status">
        <div class="orb">${go?'🟢':'🔴'}</div>
        <div>
          <div class="stitle">${esc(title)}</div>
          <div class="ssub">${esc(sub)}</div>
        </div>
        <div class="count ${go?'go':''}"><b>${r.passed}/${r.total}</b><span>signals</span></div>
      </div>
      <div class="crit">${rows}</div>
    </div>
    <div class="foot" style="text-align:left;margin-top:10px">The gate to betting money. <b>Enough races</b> (≥${r.target} priced) · <b>beats the closing line</b> · <b>well calibrated</b> · <b>holds out-of-sample</b> · <b>clears the market margin</b> (positive flat-stake ROI at SP). All five must be green — until then the honest answer is no.</div>
  </section>`;
}

function summaryCard(sr){
  return `<section class="card"><h2>📈 Top-pick strike rate</h2>
    <div class="kpis">
      <div class="kpi"><b>${sr.winPct}%</b>win</div>
      <div class="kpi"><b>${sr.placePct}%</b>place</div>
      <div class="kpi"><b>${sr.topPickWins}</b>wins</div>
      <div class="kpi"><b>${sr.topPickPlaces}</b>places</div>
      <div class="kpi"><b>${sr.settled}</b>settled</div>
    </div>
    ${sr.history&&sr.history.length?dots(sr.history):'<div class="foot" style="text-align:left">No settled races yet — this fills in automatically as results are logged.</div>'}
  </section>`;
}
function dots(h){
  return '<div class="sr">'+h.map(x=>{
    const cls=x.won?'win':(x.placed?'place':'miss'),t=x.won?'W':(x.placed?'P':'·');
    return `<span class="dot ${cls}" title="${esc(x.track)} R${x.race} ${x.date}">${t}</span>`;
  }).join('')+'</div><div class="foot" style="text-align:left;margin-top:8px">Each square = one settled race (newest right). <span style="color:var(--green)">W</span> win · <span style="color:var(--gold)">P</span> placed · miss.</div>';
}

// CONFIDENCE CALIBRATION — predicted win% (expected) vs actual win rate
function calibrationCard(sr){
  const cal=sr.calibration||[];
  const any=cal.some(c=>c.n>0);
  const rows=cal.map(c=>{
    const w=c.winPct==null?0:c.winPct;
    return `<div class="calrow">
      <div class="lbl">${esc(c.tier)}</div>
      <div class="track"><div class="fill" style="width:${Math.max(w,c.n?6:0)}%">${c.winPct==null?'':'actual '+c.winPct+'%'}</div></div>
      <div class="n">${c.expectedPct!=null?'exp '+c.expectedPct+'% · ':''}${c.n} race${c.n===1?'':'s'}</div>
    </div>`;
  }).join('');
  return `<section class="card"><h2>🎯 Confidence calibration</h2>
    ${any?rows+`<div class="foot" style="text-align:left;margin-top:8px">Picks grouped by the <b>win probability</b> we gave them. <b>exp</b> = average probability we predicted; the bar = the <b>actual</b> win rate. Well-calibrated = actual ≈ expected in each band (e.g. picks we call 40%+ should win ~40% of the time). Updates as more races settle.</div>`
        :'<div class="empty">Needs settled races. Once outcomes are logged, this checks whether our stated win probabilities match reality.</div>'}
  </section>`;
}

// CLOSING LINE VALUE — the honest edge test: model probability vs the price
// the market actually closed at. This is what tells us if there's money here.
function clvCard(sr){
  const c=sr.clv||{};
  const rows=(c.buckets||[]).filter(b=>b.n>0);
  const any=rows.length>0;
  const body=rows.map(b=>{
    const w=b.winPct==null?0:b.winPct;
    return `<div class="calrow">
      <div class="lbl">${esc(b.label)}</div>
      <div class="track"><div class="fill" style="width:${Math.max(w,b.n?6:0)}%">${b.winPct==null?'':'won '+b.winPct+'%'}</div></div>
      <div class="n">exp ${b.avgModelPct}% · mkt ${b.avgClosePct}% · ${b.n}</div>
    </div>`;
  }).join('');
  const head = any ? `<div class="kpis" style="margin-bottom:12px">
      <div class="kpi"><b>${c.pickAvgModelPct}%</b>model says</div>
      <div class="kpi"><b>${c.pickAvgClosePct}%</b>market says</div>
      <div class="kpi"><b>${c.pickWinPct}%</b>picks won</div>
      <div class="kpi"><b>${c.beatClosePicks}/${c.racesWithPrice}</b>beat close</div>
    </div>` : '';
  return `<section class="card"><h2>💰 Closing line value — the edge test</h2>
    ${any?head+body+`<div class="foot" style="text-align:left;margin-top:8px">Every priced runner grouped by how far our model's win% sat <b>above or below the starting price</b>. <b>exp</b> = our probability, <b>mkt</b> = the market's, the bar = how often they actually won. The edge is real only if the "model +" bands win <b>more than the market priced them</b> (and near our own number). ${c.runnersWithPrice} priced runners over ${c.racesWithPrice} races so far — needs a few hundred to trust.</div>`
        :'<div class="empty">No priced results yet. As meetings with starting prices are logged, this measures whether the model beats the closing market — the honest test of whether there\'s an edge to bet.</div>'}
  </section>`;
}

function historyCard(sr,m){
  const settled=(m.predictions||[]).filter(p=>p.settled).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.race||0)-(a.race||0));
  if(!settled.length) return '';
  const rows=settled.map(p=>{
    const won=p.result&&p.result.topPickWon, placed=p.result&&p.result.topPickPlaced;
    const badge=won?'<span class="tag win">WON</span>':(placed?'<span class="tag" style="color:var(--gold);border-color:rgba(212,175,55,.4)">PLACED</span>':'<span class="tag loss">missed</span>');
    return `<div class="racecard" onclick="location.href='race.html?id=${encodeURIComponent(p.id)}'">
      <div class="num">R${p.race}</div>
      <div class="mid"><div class="t">${esc(p.track)||'—'} · ${esc(p.date)}</div>
      <div class="s">pick: ${esc(p.result&&p.result.topPick||p.topPick||'—')}${p.result&&p.result.winner?' · won by '+esc(p.result.winner):''}</div></div>
      <div class="rt">${badge}</div>
    </div>`;
  }).join('');
  return `<section class="card"><h2>🗂️ Settled races</h2>${rows}</section>`;
}
</script>
</body>
</html>
